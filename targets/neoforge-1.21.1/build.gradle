plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-neoforge-1.21.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation project(':common')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: neo_minecraft_version,
            minecraft_version_range: '[1.21.1,1.21.2)',
            neo_version: neo_version,
            neo_version_range: neo_version_range,
            loader_version_range: neo_loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from project(':common').sourceSets.main.output
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
